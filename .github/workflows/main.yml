name: CI/CD Pipeline

on:
  push:

  workflow_dispatch:
    inputs:
      force-deploy:
        description: "Force a deployment even if not on main branch"
        required: false
        type: boolean
        default: false

# Cancel superseded runs on the same branch (e.g. quick successive pushes to a
# feature branch), but never cancel a run on main so deployments finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Detect which parts of the application changed
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api-changed: ${{ steps.changes.outputs.api }}
      app-changed: ${{ steps.changes.outputs.app }}
      code-changed: ${{ steps.code-changes.outputs.code }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Decides what to deploy, so main is compared against its previous push.
      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} || echo "")
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} || echo "")
          else
            # For workflow_dispatch, assume everything changed
            echo "api=true" >> $GITHUB_OUTPUT
            echo "app=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check for API changes
          if echo "$CHANGED_FILES" | grep -qE '^api/'; then
            echo "api=true" >> $GITHUB_OUTPUT
          else
            echo "api=false" >> $GITHUB_OUTPUT
          fi
          
          # Check for App changes
          if echo "$CHANGED_FILES" | grep -qE '^app/'; then
            echo "app=true" >> $GITHUB_OUTPUT
          else
            echo "app=false" >> $GITHUB_OUTPUT
          fi

      # Decides whether to build and test at all: skipped only when nothing but
      # documentation changed. A branch is compared against where it diverged
      # from main, not against its previous push: otherwise a docs-only push
      # would turn the branch green while the run that tested its code changes
      # was cancelled as superseded.
      - name: Detect code changes
        id: code-changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "code=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            BASE="${{ github.event.before }}"
          else
            git fetch origin main
            BASE=$(git merge-base HEAD origin/main)
          fi

          if ! CHANGED_FILES=$(git diff --name-only "$BASE" ${{ github.sha }}); then
            echo "code=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -n "$CHANGED_FILES" ] && ! echo "$CHANGED_FILES" | grep -qvE '\.md$'; then
            echo "Only documentation changed, skipping build and tests."
            echo "code=false" >> $GITHUB_OUTPUT
          else
            echo "code=true" >> $GITHUB_OUTPUT
          fi

  build-api:
    name: Build API
    needs: [ detect-changes ]
    if: needs.detect-changes.outputs.code-changed == 'true'
    uses: ./.github/workflows/build-api.yml

  build-app:
    name: Build App
    needs: [ detect-changes ]
    if: needs.detect-changes.outputs.code-changed == 'true'
    uses: ./.github/workflows/build-app.yml
    secrets: inherit

  e2e-tests:
    name: E2E Tests
    needs: [ build-api, build-app ]
    if: |
      always() &&
      needs.build-api.result == 'success' &&
      needs.build-app.result == 'success'
    uses: ./.github/workflows/e2e-tests.yml

  deploy:
    name: Deploy
    needs: [ detect-changes, build-api, build-app, e2e-tests ]
    if: |
      always() &&
      needs.e2e-tests.result == 'success' &&
      (
        github.event.inputs.force-deploy == 'true' ||
        (github.ref == 'refs/heads/main' && vars.DISABLE_AUTO_DEPLOY != 'true')
      )
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      deploy-api: ${{ needs.detect-changes.outputs.api-changed == 'true' }}
      deploy-app: ${{ needs.detect-changes.outputs.app-changed == 'true' }}
