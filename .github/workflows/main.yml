name: CI/CD Pipeline

on:
  # Same-repo branches are built on push, which also covers branches without a
  # pull request (Renovate's branch automerge relies on that). pull_request is
  # only for pull requests from forks, whose pushes don't trigger runs here.
  push:
  pull_request:

  workflow_dispatch:
    inputs:
      force-deploy:
        description: "Force a deployment even if not on main branch"
        required: false
        type: boolean
        default: false
      force-deploy-preview:
        description: "Force a deployment to the preview environment."
        required: false
        type: boolean
        default: false

# Least privilege by default; jobs that need more raise it below.
permissions:
  contents: read

# Cancel superseded runs on the same branch (e.g. quick successive pushes to a
# feature branch), but never cancel a run on main so deployments finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Detect which parts of the application changed
  detect-changes:
    name: Detect Changes
    # Skips the whole pipeline for same-repo pull requests, which the push run
    # already builds.
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    outputs:
      api-changed: ${{ steps.changes.outputs.api }}
      app-changed: ${{ steps.changes.outputs.app }}
      code-changed: ${{ steps.code-changes.outputs.code }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Decides what to deploy. Each unit is compared against the commit that is
      # live (its deployed/<unit> tag, moved by the deploy workflow), not against
      # the previous push: otherwise a change whose run never deployed (failed,
      # cancelled, auto-deploy disabled) would be skipped by the next run.
      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "api=true" >> $GITHUB_OUTPUT
            echo "app=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Deploys the unit when its tag is missing or the diff fails, rather
          # than risk skipping a change.
          detect() {
            local unit=$1 paths=$2 changed_files
            if ! changed_files=$(git diff --name-only "refs/tags/deployed/$unit" "${{ github.sha }}" 2>/dev/null); then
              echo "No usable deployed/$unit tag, deploying $unit."
              echo "$unit=true" >> $GITHUB_OUTPUT
            elif echo "$changed_files" | grep -qE "$paths"; then
              echo "$unit=true" >> $GITHUB_OUTPUT
            else
              echo "$unit=false" >> $GITHUB_OUTPUT
            fi
          }

          detect api '^(api/|\.github/workflows/build-api\.yml$)'
          detect app '^(app/|\.github/workflows/build-app\.yml$)'

      # Decides whether to build and test at all: skipped only when nothing but
      # documentation changed. A branch is compared against where it diverged
      # from main, not against its previous push: otherwise a docs-only push
      # would turn the branch green while the run that tested its code changes
      # was cancelled as superseded.
      - name: Detect code changes
        id: code-changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "code=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            BASE="${{ github.event.before }}"
          else
            git fetch origin main
            BASE=$(git merge-base HEAD origin/main)
          fi

          if ! CHANGED_FILES=$(git diff --name-only "$BASE" ${{ github.sha }}); then
            echo "code=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -n "$CHANGED_FILES" ] && ! echo "$CHANGED_FILES" | grep -qvE '\.md$'; then
            echo "Only documentation changed, skipping build and tests."
            echo "code=false" >> $GITHUB_OUTPUT
          else
            echo "code=true" >> $GITHUB_OUTPUT
          fi

  build-api:
    name: Build API
    needs: [ detect-changes ]
    if: needs.detect-changes.outputs.code-changed == 'true'
    uses: ./.github/workflows/build-api.yml

  build-app:
    name: Build App
    needs: [ detect-changes ]
    if: needs.detect-changes.outputs.code-changed == 'true'
    uses: ./.github/workflows/build-app.yml
    secrets: inherit
    # Uploads the Fallow SARIF results to code scanning.
    permissions:
      contents: read
      security-events: write

  e2e-tests:
    name: E2E Tests
    needs: [ build-api, build-app ]
    if: |
      always() &&
      needs.build-api.result == 'success' &&
      needs.build-app.result == 'success'
    uses: ./.github/workflows/e2e-tests.yml

  deploy:
    name: Deploy
    needs: [ detect-changes, build-api, build-app, e2e-tests ]
    if: |
      always() &&
      needs.e2e-tests.result == 'success' &&
      (
        github.event.inputs.force-deploy == 'true' ||
        (github.ref == 'refs/heads/main' && vars.DISABLE_AUTO_DEPLOY != 'true')
      )
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      deploy-api: ${{ needs.detect-changes.outputs.api-changed == 'true' }}
      deploy-app: ${{ needs.detect-changes.outputs.app-changed == 'true' }}

  # Every successful push to a branch other than main goes to the single preview
  # environment, so the last push wins. Renovate branches are left out so they
  # don't keep overwriting the preview.
  deploy-preview:
    name: Deploy Preview
    needs: [ e2e-tests ]
    if: |
      always() &&
      needs.e2e-tests.result == 'success' &&
      (
        github.event.inputs.force-deploy-preview == 'true' ||
        (
          github.event_name == 'push' &&
          github.ref != 'refs/heads/main' &&
          !startsWith(github.ref, 'refs/heads/renovate/')
        )
      )
    uses: ./.github/workflows/deploy-preview.yml
    secrets: inherit
