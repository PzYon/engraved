name: Build App

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm install
        run: npm ci

      - name: Check types
        working-directory: app
        run: npm run types:check

      # The audit below only reports findings in changed files, so it misses
      # code that a change elsewhere left unused. This scans the whole project.
      - name: Fallow dead code
        run: npm run fallow

      - name: Determine fallow diff base
        id: fallow-base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            # A branch is compared against where it diverged from main, not
            # against its previous push: the audit only fails on findings that
            # are new relative to the base, so with the previous push as base a
            # finding that failed one run would count as inherited in the next
            # and any follow-up push would turn the build green.
            git fetch origin main
            echo "ref=$(git merge-base HEAD origin/main)" >> "$GITHUB_OUTPUT"
          fi

      - name: Fallow audit
        uses: fallow-rs/fallow@v3
        with:
          command: audit
          gate: new-only
          format: sarif
          annotations: false
          changed-since: ${{ steps.fallow-base.outputs.ref }}

      # Also runs in the pre-commit hook, but Renovate, agents and --no-verify
      # commits skip that.
      - name: Prettier
        run: npm run prettier:check

      - name: Lint
        run: npm run lint

      - name: Run tests
        working-directory: app
        run: npx vitest run

      - name: Build
        working-directory: app
        env:
          VITE_COMMIT_HASH: ${{ github.sha }}
          VITE_VERSION: ${{ github.run_number }}
          VITE_APP_INSIGHTS_CONNECTING_STRING: ${{ secrets.APP_INSIGHTS_CONNECTING_STRING }}
        run: VITE_MERGE_DATE_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ') npm run build

      - name: Merge Fallow SARIF runs
        if: always() && hashFiles('fallow-results.sarif') != ''
        shell: bash
        run: |
          # The audit writes one SARIF run per analysis (dead code, complexity),
          # all for the same tool, and the upload rejects several runs that
          # share a category.
          jq '.runs |= [{ tool: { driver: (.[0].tool.driver + { rules: (map(.tool.driver.rules) | add) }) }, results: (map(.results) | add) }]' \
            fallow-results.sarif > fallow-results.merged.sarif
          mv fallow-results.merged.sarif fallow-results.sarif

      - name: Upload Fallow SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('fallow-results.sarif') != ''
        with:
          sarif_file: fallow-results.sarif

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: app/dist
          retention-days: 30
