name: Build API

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build API
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # note: no mongo service container is needed. The integration tests use EphemeralMongo,
    # which downloads and runs its own mongod on a random free port per test process.

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: api/global.json
          cache: true
          cache-dependency-path: |
            api/**/*.csproj
            api/Directory.Packages.props

      - name: Cache EphemeralMongo binaries
        uses: actions/cache@v6
        with:
          path: ~/.local/share/ephemeral-mongo
          key: ephemeral-mongo-${{ runner.os }}

      - name: Run tests
        run: dotnet test /p:CollectCoverage=true /p:CoverletOutputFormat=opencover
        working-directory: api

      - name: Publish
        run: dotnet publish ./Engraved.Api/Engraved.Api.csproj -c Release -o "${{ env.DOTNET_ROOT }}/Engraved.Api" -p:SourceRevisionId=${{ github.run_number }}+${{ github.sha }}+$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        working-directory: api

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: api
          path: ${{ env.DOTNET_ROOT }}/Engraved.Api
          retention-days: 30
