name: Build API

on:
  workflow_call:
    outputs:
      artifact-name:
        description: "The name of the uploaded artifact"
        value: ${{ jobs.build.outputs.artifact-name }}
  workflow_dispatch:

jobs:
  build:
    name: Build API
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact-name: api

    # note: no mongo service container is needed. The integration tests use EphemeralMongo,
    # which downloads and runs its own mongod on a random free port per test process.

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: api/global.json
          cache: true
          cache-dependency-path: |
            api/**/*.csproj
            api/Directory.Packages.props

      - name: Cache EphemeralMongo binaries
        uses: actions/cache@v6
        with:
          path: ~/.local/share/ephemeral-mongo
          key: ephemeral-mongo-${{ runner.os }}

      - name: Run tests
        run: >-
          dotnet test --logger trx --results-directory TestResults --collect "XPlat Code Coverage"
          -- "DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude=[Engraved.TestUtils]*"
        working-directory: api

      - name: Publish test results and coverage
        if: ${{ !cancelled() }}
        run: python3 ../.github/scripts/summarize-api-tests.py TestResults >> "$GITHUB_STEP_SUMMARY"
        working-directory: api

      - name: Get current time
        id: current-time
        shell: bash
        run: echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: dotnet publish ./Engraved.Api/Engraved.Api.csproj -c Release -o "${{env.DOTNET_ROOT}}/Engraved.Api" -p:SourceRevisionId=${{github.run_number}}+${{github.sha}}+${{steps.current-time.outputs.time}}
        working-directory: api

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: api
          path: ${{env.DOTNET_ROOT}}/Engraved.Api
          retention-days: 30
