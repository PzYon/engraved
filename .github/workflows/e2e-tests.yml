name: E2E Tests

on:
  workflow_call:

jobs:
  test:
    name: Run Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        project: [chromium, android]

    services:
      mongo:
        image: mongo
        ports:
          - 27017:27017

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Download API artifact
        uses: actions/download-artifact@v8
        with:
          name: api
          path: ./api-artifact

      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: app
          path: ./app-artifact

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: api/global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm install
        run: npm ci --workspace tests --include-workspace-root

      - name: Check types
        working-directory: tests
        run: npm run types:check

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: tests
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        working-directory: tests
        run: npm run e2e:run-tests -- --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}-${{ github.run_attempt }}
          path: tests/playwright-report/**/*
          retention-days: 5

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ matrix.project }}-${{ github.run_attempt }}
          path: tests/test-results/**/*
          retention-days: 5
