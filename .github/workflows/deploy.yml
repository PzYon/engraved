name: Deploy

on:
  workflow_call:
    inputs:
      deploy-api:
        required: true
        type: boolean
      deploy-app:
        required: true
        type: boolean

jobs:
  deploy-app:
    name: Deploy App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: inputs.deploy-app
    permissions:
      contents: write

    environment:
      name: "Production App"
      url: ${{ steps.deploy-to-static-app.outputs.static_web_app_url }}

    steps:
      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: app

      - name: Deploy to Azure Static Web App
        id: deploy-to-static-app
        uses: Azure/static-web-apps-deploy@v1
        with:
          skip_app_build: true
          app_location: "/"
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_JOLLY_HILL_0967E3203 }}
          action: "upload"

      # Marks this commit as live, so the next run detects changes against it.
      - name: Move deployed/app tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/deployed/app" -f sha="${{ github.sha }}" -F force=true \
            || gh api --method POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/deployed/app" -f sha="${{ github.sha }}"

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: inputs.deploy-api
    permissions:
      contents: write

    environment:
      name: "Production API"
      url: ${{ steps.deploy-to-app-service.outputs.webapp-url }}

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v8
        with:
          name: api

      - name: Deploy to Azure App Service
        id: deploy-to-app-service
        uses: azure/webapps-deploy@v3
        with:
          app-name: engraved-lnx
          slot-name: "Production"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_CF17B8AFBCD14051B9CD5C069F5E294E_LNX }}
          package: .

      # The root endpoint queries the database, so a 200 means the API is up and can reach
      # MongoDB. Retried because the app restarts after the deployment.
      - name: Verify API health
        shell: bash
        env:
          WEBAPP_URL: ${{ steps.deploy-to-app-service.outputs.webapp-url }}
        run: |
          if [ -z "$WEBAPP_URL" ]; then
            echo "::error::The deploy step did not report a web app URL."
            exit 1
          fi
          HEALTH_URL="${WEBAPP_URL%/}/"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 20 --output /dev/null "$HEALTH_URL"; then
              echo "API is healthy (attempt $attempt)."
              exit 0
            fi
            echo "API not healthy yet (attempt $attempt), retrying in 10s."
            sleep 10
          done
          echo "::error::API did not become healthy at $HEALTH_URL after deployment."
          exit 1

      # Marks this commit as live, so the next run detects changes against it.
      - name: Move deployed/api tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/deployed/api" -f sha="${{ github.sha }}" -F force=true \
            || gh api --method POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/deployed/api" -f sha="${{ github.sha }}"
